    <body>

        <h1>Dashboard Interativo — Airbnb (amostra)</h1>

        <div class="dashboard">
            <div class="panel" id="map-panel">
                <h2>Mapa (Where)</h2>
                <svg id="map" width="700" height="500"></svg>
            </div>
            <div class="panel" id="controls-panel">
                <h2>Overview & Controls</h2>
                <div id="timeline"></div>
                <div id="histogram"></div>
            </div>
            <div class="panel" id="details-panel">
                <h2>Details on demand</h2>
                <div id="details"></div>
            </div>
        </div>

        <script src="https://d3js.org/d3.v7.min.js"></script>

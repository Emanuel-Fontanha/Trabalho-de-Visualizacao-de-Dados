<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Airbnb Dashboard</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <h1>Dashboard Interativo — Airbnb (amostra)</h1>

        <div class="dashboard">
            <div class="panel" id="map-panel">
                <h2>Mapa (Where)</h2>
                <svg id="map" width="700" height="380"></svg>

                <hr style="border: 0; border-top: 1px solid #eee; margin: 16px 0 8px 0;">
                <h3 style="margin: 0; font-size: 14px; color: #555;">Mapa da Cidade Selecionada</h3>
                
                <p style="margin: 4px 0 12px 0; font-size: 12px; color: #888;">Role o scroll do mouse para aplicar zoom e arraste para mover o mapa</p>
                
                <svg id="detail-map" width="700" height="240"></svg>
            </div>
            <div class="panel" id="controls-panel">
                <h2>Visão Geral & Controles</h2>

                <h3>Cidades (Where)</h3>
                <div id="city-filter" class="chip-row"></div>

                <h3>Linha do tempo de Reviews (When)</h3>
                <svg id="timeline-chart" width="430" height="180"></svg>

                <h3>Distribuição de Preços (What)</h3>
                <svg id="histogram-chart" width="430" height="220"></svg>
            </div>
            <div class="panel" id="details-panel">
                <h2>Detalhes do imóvel</h2>
                <button id="clear-filters" type="button">Limpar filtros</button>
                <span id="active-filter-count" class="active-filter-count"></span>
                <p id="filter-status"></p>
                <div id="details"></div>
            </div>
        </div>

        <div id="loading">Carregando dados…</div>

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script type="module" src="/src/main.js"></script>


<!--         <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="/script.js"></script> -->
    </body>

</html>
